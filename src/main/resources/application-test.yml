spring:
  application:
    name: enterprise-oms-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false
      fail-fast: false
    producer:
      properties:
        max.block.ms: 100
        request.timeout.ms: 100

logging:
  level:
    root: INFO
    com.enterprise.oms: DEBUG
    org.apache.kafka: ERROR
